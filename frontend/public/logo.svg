<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rocket body -->
  <path d="M32 8 L40 28 L40 44 L36 52 L28 52 L24 44 L24 28 Z" fill="url(#rocketBody)"/>

  <!-- Rocket nose cone -->
  <path d="M32 8 L38 22 L26 22 Z" fill="url(#noseCone)"/>

  <!-- Window -->
  <circle cx="32" cy="30" r="5" fill="#1E1B4B" stroke="#22D3EE" stroke-width="1.5"/>
  <circle cx="32" cy="30" r="2.5" fill="#22D3EE" opacity="0.3"/>

  <!-- Side fins -->
  <path d="M24 36 L16 48 L24 44 Z" fill="url(#finGradient)"/>
  <path d="M40 36 L48 48 L40 44 Z" fill="url(#finGradient)"/>

  <!-- Engine flames -->
  <path d="M28 52 L32 62 L36 52" fill="url(#flameOuter)" opacity="0.9"/>
  <path d="M30 52 L32 58 L34 52" fill="url(#flameInner)"/>

  <!-- Accent lines on body -->
  <line x1="28" y1="38" x2="36" y2="38" stroke="#22D3EE" stroke-width="1" opacity="0.5"/>
  <line x1="29" y1="42" x2="35" y2="42" stroke="#22D3EE" stroke-width="0.75" opacity="0.3"/>

  <!-- Stars -->
  <circle cx="10" cy="20" r="1" fill="#A78BFA" opacity="0.6"/>
  <circle cx="54" cy="16" r="1.2" fill="#22D3EE" opacity="0.5"/>
  <circle cx="52" cy="36" r="0.8" fill="#F59E0B" opacity="0.4"/>
  <circle cx="12" cy="44" r="1" fill="#22D3EE" opacity="0.5"/>

  <defs>
    <linearGradient id="rocketBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="50%" stop-color="#A5B4FC"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <linearGradient id="noseCone" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="finGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>

    <linearGradient id="flameOuter" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <linearGradient id="flameInner" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
</svg>
