<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#1a2332" stroke="#10b981" stroke-width="3"/>

  <!-- Head with glasses -->
  <circle cx="100" cy="75" r="25" fill="#34d399" stroke="#10b981" stroke-width="2"/>

  <!-- Glasses -->
  <g transform="translate(100, 75)">
    <circle cx="-10" r="8" fill="none" stroke="#1e3a8a" stroke-width="2"/>
    <circle cx="10" r="8" fill="none" stroke="#1e3a8a" stroke-width="2"/>
    <line x1="-2" y1="0" x2="2" y2="0" stroke="#1e3a8a" stroke-width="2"/>
  </g>

  <!-- Business suit -->
  <path d="M 70 100 L 70 160 L 95 160 L 95 145 L 105 145 L 105 160 L 130 160 L 130 100 Q 115 98 100 98 Q 85 98 70 100 Z" fill="#1e3a8a" stroke="#1e40af" stroke-width="2"/>

  <!-- Tie -->
  <path d="M 100 100 L 95 145 L 100 155 L 105 145 Z" fill="#10b981"/>

  <!-- Money/Coins symbol -->
  <g transform="translate(100, 130)">
    <!-- Large coin -->
    <circle r="15" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
    <text x="0" y="6" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e3a8a">$</text>

    <!-- Small coins -->
    <circle cx="20" cy="-5" r="8" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="-20" cy="-5" r="8" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
</svg>
