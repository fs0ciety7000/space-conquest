<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#1a2332" stroke="#a855f7" stroke-width="3"/>

  <!-- Wild hair -->
  <g transform="translate(100, 60)">
    <!-- Hair spikes -->
    <path d="M -25,10 Q -30,-5 -25,-15" fill="none" stroke="#9333ea" stroke-width="3" stroke-linecap="round"/>
    <path d="M -15,5 Q -15,-10 -10,-20" fill="none" stroke="#9333ea" stroke-width="3" stroke-linecap="round"/>
    <path d="M 0,0 Q 0,-15 0,-25" fill="none" stroke="#9333ea" stroke-width="3" stroke-linecap="round"/>
    <path d="M 15,5 Q 15,-10 10,-20" fill="none" stroke="#9333ea" stroke-width="3" stroke-linecap="round"/>
    <path d="M 25,10 Q 30,-5 25,-15" fill="none" stroke="#9333ea" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Head -->
  <circle cx="100" cy="80" r="25" fill="#c084fc" stroke="#a855f7" stroke-width="2"/>

  <!-- Crazy goggles -->
  <g transform="translate(100, 75)">
    <circle cx="-11" r="10" fill="none" stroke="#06b6d4" stroke-width="3"/>
    <circle cx="11" r="10" fill="none" stroke="#06b6d4" stroke-width="3"/>
    <circle cx="-11" r="7" fill="#06b6d4" opacity="0.3"/>
    <circle cx="11" r="7" fill="#06b6d4" opacity="0.3"/>
    <line x1="-1" y1="0" x2="1" y2="0" stroke="#06b6d4" stroke-width="3"/>
  </g>

  <!-- Lab coat -->
  <path d="M 70 105 L 70 165 L 95 165 L 95 150 L 105 150 L 105 165 L 130 165 L 130 105 Q 115 103 100 103 Q 85 103 70 105 Z" fill="#e0e7ff" stroke="#a855f7" stroke-width="2"/>

  <!-- Lightning/Energy symbol -->
  <g transform="translate(100, 135)">
    <polygon points="5,-15 -5,-5 0,-5 -8,15 5,0 0,0" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5"/>
    <!-- Energy particles -->
    <circle cx="-12" cy="-8" r="2" fill="#06b6d4"/>
    <circle cx="12" cy="-10" r="2.5" fill="#a855f7"/>
    <circle cx="-10" cy="8" r="2" fill="#10b981"/>
  </g>
</svg>
