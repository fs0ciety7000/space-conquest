<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#1a2332" stroke="#f59e0b" stroke-width="3"/>

  <!-- Protective helmet -->
  <path d="M 70 70 Q 70 55 100 55 Q 130 55 130 70 L 130 85 L 70 85 Z" fill="#44403c" stroke="#78716c" stroke-width="2"/>

  <!-- Visor down -->
  <rect x="75" y="68" width="50" height="15" rx="3" fill="#0c0a09" opacity="0.9"/>
  <line x1="75" y1="73" x2="125" y2="73" stroke="#f59e0b" stroke-width="0.5" opacity="0.5"/>
  <line x1="75" y1="78" x2="125" y2="78" stroke="#f59e0b" stroke-width="0.5" opacity="0.5"/>

  <!-- Shoulders/Apron -->
  <path d="M 68 90 L 68 130 L 78 130 L 78 100 L 122 100 L 122 130 L 132 130 L 132 90 Q 115 88 100 88 Q 85 88 68 90 Z" fill="#57534e" stroke="#44403c" stroke-width="2"/>

  <!-- Leather apron -->
  <rect x="80" y="100" width="40" height="60" fill="#78350f" stroke="#92400e" stroke-width="2"/>
  <line x1="85" y1="110" x2="115" y2="110" stroke="#92400e" stroke-width="1"/>
  <line x1="85" y1="120" x2="115" y2="120" stroke="#92400e" stroke-width="1"/>
  <line x1="85" y1="130" x2="115" y2="130" stroke="#92400e" stroke-width="1"/>

  <!-- Hammer and Anvil -->
  <g transform="translate(85, 145)">
    <!-- Anvil -->
    <path d="M -8,0 L -6,-5 L 6,-5 L 8,0 L 8,5 L -8,5 Z" fill="#44403c" stroke="#1c1917" stroke-width="1.5"/>
  </g>
  <g transform="translate(115, 135)">
    <!-- Hammer -->
    <rect x="-3" y="5" width="6" height="20" fill="#78350f"/>
    <rect x="-8" y="-5" width="16" height="10" rx="2" fill="#78716c" stroke="#44403c" stroke-width="1.5"/>
  </g>

  <!-- Sparks -->
  <circle cx="95" cy="142" r="1.5" fill="#fbbf24"/>
  <circle cx="98" cy="138" r="1" fill="#f59e0b"/>
  <circle cx="92" cy="145" r="1.2" fill="#fbbf24"/>
</svg>
