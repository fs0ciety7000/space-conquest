<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#1a2332" stroke="#8b5cf6" stroke-width="3"/>

  <!-- Mortarboard (graduation cap) -->
  <g transform="translate(100, 55)">
    <rect x="-30" y="-5" width="60" height="5" fill="#1e3a8a"/>
    <ellipse cy="-3" rx="18" ry="10" fill="#1e40af"/>
    <line x1="30" y1="-2" x2="38" y2="10" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="38" cy="10" r="3" fill="#fbbf24"/>
  </g>

  <!-- Head with glasses -->
  <circle cx="100" cy="80" r="25" fill="#a78bfa" stroke="#8b5cf6" stroke-width="2"/>

  <!-- Round glasses -->
  <g transform="translate(100, 75)">
    <circle cx="-10" r="8" fill="none" stroke="#1e3a8a" stroke-width="2.5"/>
    <circle cx="10" r="8" fill="none" stroke="#1e3a8a" stroke-width="2.5"/>
    <line x1="-2" y1="0" x2="2" y2="0" stroke="#1e3a8a" stroke-width="2.5"/>
  </g>

  <!-- Academic robe -->
  <path d="M 70 105 L 70 165 L 95 165 L 95 150 L 105 150 L 105 165 L 130 165 L 130 105 Q 115 103 100 103 Q 85 103 70 105 Z" fill="#4c1d95" stroke="#8b5cf6" stroke-width="2"/>

  <!-- Book symbol -->
  <g transform="translate(100, 135)">
    <rect x="-15" y="-10" width="30" height="20" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <line x1="-15" y1="-5" x2="15" y2="-5" stroke="#f59e0b" stroke-width="0.5"/>
    <line x1="-15" y1="0" x2="15" y2="0" stroke="#f59e0b" stroke-width="0.5"/>
    <line x1="-15" y1="5" x2="15" y2="5" stroke="#f59e0b" stroke-width="0.5"/>
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
</svg>
