<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with glow -->
  <defs>
    <radialGradient id="strategistGlow">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1a2332" stop-opacity="1"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="90" fill="url(#strategistGlow)" stroke="#dc2626" stroke-width="4"/>

  <!-- Grand helmet -->
  <path d="M 65 65 Q 65 40 100 40 Q 135 40 135 65 L 135 82 L 65 82 Z" fill="#450a0a" stroke="#dc2626" stroke-width="3"/>

  <!-- Helmet decoration -->
  <ellipse cx="100" cy="65" rx="35" ry="8" fill="#7f1d1d"/>

  <!-- Majestic plume -->
  <path d="M 90 40 Q 88 20 95 10 Q 100 5 105 10 Q 112 20 110 40" fill="#ef4444" stroke="#dc2626" stroke-width="2" opacity="0.8"/>

  <!-- Visor with details -->
  <rect x="70" y="65" width="60" height="15" rx="4" fill="#1e1b4b" opacity="0.9"/>
  <line x1="75" y1="70" x2="125" y2="70" stroke="#dc2626" stroke-width="1" opacity="0.5"/>
  <line x1="75" y1="75" x2="125" y2="75" stroke="#dc2626" stroke-width="1" opacity="0.5"/>

  <!-- Elite armor -->
  <path d="M 63 87 L 63 135 L 73 135 L 73 102 L 127 102 L 127 135 L 137 135 L 137 87 Q 118 85 100 85 Q 82 85 63 87 Z" fill="#7f1d1d" stroke="#450a0a" stroke-width="2"/>

  <!-- Chest plate with emblem -->
  <rect x="80" y="102" width="40" height="33" fill="#450a0a" stroke="#dc2626" stroke-width="2"/>
  <polygon points="100,110 104,117 112,117 106,122 108,130 100,125 92,130 94,122 88,117 96,117" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- Battle standard -->
  <g transform="translate(100, 150)">
    <line y1="-10" y2="15" stroke="#dc2626" stroke-width="3"/>
    <path d="M 0,-10 L 15,-10 L 15,5 L 7.5,0 L 0,5 Z" fill="#dc2626" stroke="#450a0a" stroke-width="1.5"/>
  </g>
</svg>
