<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#1a2332" stroke="#3b82f6" stroke-width="3"/>

  <!-- Engineer helmet -->
  <path d="M 60 80 Q 60 50 100 50 Q 140 50 140 80 L 140 110 L 60 110 Z" fill="#60a5fa" stroke="#3b82f6" stroke-width="2"/>

  <!-- Visor -->
  <rect x="65" y="70" width="70" height="25" rx="5" fill="#0c1829" opacity="0.8"/>
  <line x1="70" y1="75" x2="130" y2="75" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
  <line x1="70" y1="85" x2="130" y2="85" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>

  <!-- Gear symbol -->
  <g transform="translate(100, 140)">
    <circle r="20" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <circle r="8" fill="#f59e0b"/>
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#f59e0b" stroke-width="3"/>
    <line x1="0" y1="-20" x2="0" y2="20" stroke="#f59e0b" stroke-width="3"/>
    <line x1="-14" y1="-14" x2="14" y2="14" stroke="#f59e0b" stroke-width="3"/>
    <line x1="-14" y1="14" x2="14" y2="-14" stroke="#f59e0b" stroke-width="3"/>
  </g>
</svg>
