<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with glow -->
  <defs>
    <radialGradient id="archivistGlow">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1a2332" stop-opacity="1"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="90" fill="url(#archivistGlow)" stroke="#a855f7" stroke-width="4"/>

  <!-- Ancient hood -->
  <path d="M 65 55 Q 65 35 100 35 Q 135 35 135 55 L 135 90 Q 130 85 120 85 Q 80 85 80 85 Q 70 85 65 90 Z" fill="#4c1d95" stroke="#a855f7" stroke-width="2"/>

  <!-- Hood ornament -->
  <g transform="translate(100, 50)">
    <circle r="8" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
    <circle r="4" fill="#8b5cf6"/>
  </g>

  <!-- Head -->
  <circle cx="100" cy="85" r="22" fill="#c084fc" stroke="#a855f7" stroke-width="2"/>

  <!-- Mystical robes -->
  <path d="M 68 107 L 68 170 L 132 170 L 132 107 Q 116 105 100 105 Q 84 105 68 107 Z" fill="#5b21b6" stroke="#7c3aed" stroke-width="2"/>

  <!-- Robe patterns -->
  <g opacity="0.6">
    <circle cx="85" cy="125" r="4" fill="none" stroke="#fbbf24" stroke-width="1"/>
    <circle cx="100" cy="135" r="5" fill="none" stroke="#fbbf24" stroke-width="1"/>
    <circle cx="115" cy="125" r="4" fill="none" stroke="#fbbf24" stroke-width="1"/>
  </g>

  <!-- Ancient scroll -->
  <g transform="translate(100, 145)">
    <rect x="-18" y="-12" width="36" height="24" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <!-- Scroll ends -->
    <rect x="-20" y="-10" width="4" height="20" fill="#92400e"/>
    <rect x="16" y="-10" width="4" height="20" fill="#92400e"/>
    <!-- Ancient text -->
    <line x1="-12" y1="-6" x2="12" y2="-6" stroke="#78350f" stroke-width="0.8"/>
    <line x1="-12" y1="-2" x2="12" y2="-2" stroke="#78350f" stroke-width="0.8"/>
    <line x1="-12" y1="2" x2="12" y2="2" stroke="#78350f" stroke-width="0.8"/>
    <line x1="-12" y1="6" x2="8" y2="6" stroke="#78350f" stroke-width="0.8"/>
  </g>

  <!-- Floating knowledge particles -->
  <circle cx="70" cy="95" r="2" fill="#a855f7" opacity="0.7"/>
  <circle cx="130" cy="100" r="2.5" fill="#06b6d4" opacity="0.7"/>
  <circle cx="75" cy="115" r="2" fill="#10b981" opacity="0.7"/>
  <circle cx="125" cy="110" r="2" fill="#fbbf24" opacity="0.7"/>
</svg>
