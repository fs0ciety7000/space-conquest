<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#0f172a"/>

  <!-- Gradient circles -->
  <defs>
    <radialGradient id="grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </radialGradient>
  </defs>

  <circle cx="256" cy="256" r="200" fill="url(#grad)"/>

  <!-- Icon placeholder -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="10,5"/>

  <!-- Question mark -->
  <text x="256" y="296" font-family="Arial, sans-serif" font-size="160" font-weight="bold" fill="#64748b" text-anchor="middle">?</text>

  <!-- Small text -->
  <text x="256" y="380" font-family="Arial, sans-serif" font-size="20" fill="#475569" text-anchor="middle">Image à venir</text>
</svg>
