<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Space Conquest - Jeu de stratégie spatiale en temps réel" />
    <meta name="theme-color" content="#6366f1" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SpaceConq" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    
    <title>Space Conquest</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator && import.meta.env.PROD) {  // ✅ Seulement en production
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW enregistré:', registration.scope);
            })
            .catch((error) => {
              console.log('Erreur SW:', error);
            });
        });
      }
    </script>
  </body>
</html>
